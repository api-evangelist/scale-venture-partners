aid: scale-venture-partners
name: Scale Venture Partners
description: >-
  Scale Venture Partners (ScaleVP) is an early-stage venture capital firm based
  in Foster City, California, that invests primarily at Series A and Series B in
  founders applying AI to how businesses actually work. The firm traces its
  origins to 2000 as BA Venture Partners, the venture arm of Bank of America,
  and became an independent partnership in 2007. Scale focuses on AI and B2B
  software spanning applications, developer tools and infrastructure, and
  security, and leads roughly 80% of the rounds it joins. Initial checks
  typically range from $5M to $50M, sized to the round, and the firm looks for
  signed customers and repeatable demand (commonly $500K–$5M ARR) rather than
  a fixed revenue bar. Scale reports about $2.8B in assets under management and
  is currently deploying its $900M Fund VIII, raised in 2022. It invests across
  North America, Europe, and Israel, and pairs capital with a Go-To-Market
  advisory bench of CROs, CMOs, and CFOs. Scale has produced 11 IPOs — among
  the highest rates for early-stage firms — with notable investments including
  DocuSign, Box, HubSpot, BILL, and JFrog.
